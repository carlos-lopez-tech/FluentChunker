name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Lets the job request the OIDC token that nuget.org exchanges for a short-lived publish key
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link resolves commits against the full history
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The tag is the single source of version truth, so v1.2.3 ships as 1.2.3
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore FluentChunker.slnx

      - name: Build
        run: dotnet build FluentChunker.slnx --no-restore -c Release -warnaserror -p:Version=${{ steps.version.outputs.version }}

      # Never publish an untested package
      - name: Test
        run: dotnet test tests/FluentChunker.Tests --no-build -c Release

      - name: Pack
        run: dotnet pack src/FluentChunker/FluentChunker.csproj --no-build -c Release -o ./artifacts -p:Version=${{ steps.version.outputs.version }}

      # Trusted publishing instead of a stored API key, so no long-lived credential exists to leak.
      # The issued key lives one hour, which is why this sits immediately before the push rather than at the top of the job.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushing the .nupkg uploads the matching .snupkg from the same folder automatically
      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Pulls just this version's section, stopping at the next heading and dropping the
      # link definitions that live at the end of the file
      - name: Extract changelog entry
        id: notes
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, "## " v)) found = 1; next }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen is SemVer's prerelease marker, so v1.0.0-preview.1 must not
          # take over as the repository's latest release
          case "${{ steps.version.outputs.version }}" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg \
              --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
          else
            gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg ./artifacts/*.snupkg \
              --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
