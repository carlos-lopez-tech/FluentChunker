name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly disclosed advisory in a dependency surfaces without a push
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Source Link resolves commits against the full history
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FluentChunker.slnx

      - name: Build
        run: dotnet build FluentChunker.slnx --no-restore -c Release -warnaserror

      # Runs the Sweep category too, which proves the chunk invariants still hold across a 1.2 MB document, where budget arithmetic and offset tracking have room to drift apart.
      - name: Test
        run: dotnet test tests/FluentChunker.Tests --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Uploading from the same job keeps the report tied to the commit that produced it.
      # Coveralls identifies a public repository from the default job token, so no account secret is involved.
      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          # One report per target framework, merged so a line counts as covered when either run reaches it
          files: ./coverage/**/coverage.cobertura.xml
          format: cobertura

      # A moved chunk boundary is a breaking change no API diff reveals, because an adopter who upgrades and gets different chunk text has to re-embed and re-index their corpus.
      # This gate sits ahead of Pack so a failure stops the artifact rather than merely annotating it.
      - name: Verify chunk boundaries
        run: >
          dotnet run --project benchmarks/FluentChunker.Benchmarks
          --no-build -c Release -- drift

      - name: Pack
        run: dotnet pack src/FluentChunker/FluentChunker.csproj --no-build -c Release -o ./artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*.*nupkg
          if-no-files-found: error

  vulnerable-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Restore first: the listing only reports transitives once the graph is resolved
      - name: Restore
        run: dotnet restore FluentChunker.slnx

      # Catches transitive advisories like the pinned Microsoft.Bcl.Memory fix (NU1903) without anyone going looking.
      # dotnet list always exits 0, so the report text is what decides; the language is pinned to keep the match deterministic.
      - name: Check for vulnerable packages
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          dotnet list src/FluentChunker/FluentChunker.csproj package --vulnerable --include-transitive | tee vulnerable.log
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi

      - name: Check for deprecated packages
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          dotnet list src/FluentChunker/FluentChunker.csproj package --deprecated | tee deprecated.log
          if grep -q "has the following deprecated packages" deprecated.log; then
            echo "::error::Deprecated packages detected"
            exit 1
          fi
